name: Arenatrade 15m Auto-Scanner & Copy-Trader

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arenatrade-15m-scanner
  cancel-in-progress: false

jobs:
  continuous-cloud-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore SQLite memory (15m Historical Comparison & Copy-Trader 2-Strike State)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/futures_intelligence.db
            data/futures_intelligence.db-journal
            data/futures_intelligence.db-wal
            data/futures_intelligence.db-shm
          key: arenatrade-db-${{ github.run_id }}
          restore-keys: |
            arenatrade-db-

      - name: Install dependencies
        run: |
          mkdir -p data
          pip install --quiet -r requirements.txt

      - name: Run safety and validation tests before starting live cycle
        run: python -m pytest -q

      - name: Run Continuous 2h45m Exact-15m Scanner + 90s Copy-Trader + Live Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_AUTO_SEND: "true"
          SEND_SCAN_SUMMARY_REPORT: "true"
          AUTO_SCAN_INTERVAL_SEC: "900"
          SCAN_SYNC_CANDLE_CLOSE: "true"
          MIN_RISK_REWARD_RATIO: "2.0"
          ESTIMATED_ROUND_TRIP_COST_PCT: "0.18"
          STRATEGY_VERSION: "MA_V1_FROZEN_2026_11_05"
          VALIDATION_ENTRY_WINDOW_BARS: "8"
          VALIDATION_MAX_HOLD_BARS: "96"
          COPY_MONITOR_INTERVAL_SEC: "90"
          DAEMON_DURATION_SEC: "9900"
        run: python run_cloud_daemon.py

      - name: Save SQLite memory atomically before cycle handoff
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/futures_intelligence.db
            data/futures_intelligence.db-journal
            data/futures_intelligence.db-wal
            data/futures_intelligence.db-shm
          key: arenatrade-db-${{ github.run_id }}

      - name: Weekly keepalive to prevent GitHub 60-day inactivity pause
        if: always()
        run: |
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" -lt "03" ]; then
            date -u +"Active keepalive: %Y-%m-%d %H:%M UTC" > HEARTBEAT.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add HEARTBEAT.txt
            git commit -m "chore: weekly cron keepalive" || true
            git push || true
          fi

      - name: Seamlessly relay next 2h45m cloud cycle (zero-gap 24/7 execution)
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_WORKFLOW_TOKEN }}
        run: |
          if [ -n "$GH_PAT" ]; then
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/arenatrade_15m_auto.yml/dispatches" \
              -d '{"ref":"main"}' || true
          fi
