name: Arenatrade Independent Cloud Supervisor

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: arenatrade-independent-supervisor
  cancel-in-progress: true

jobs:
  audit-live-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify daemon is active; restart only when genuinely absent
        env:
          GH_PAT: ${{ secrets.GH_WORKFLOW_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request

          token = os.environ["GH_PAT"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "arenatrade-supervisor",
          }

          def request(url, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as res:
                  return res.status, (json.loads(res.read()) if res.status != 204 else None)

          base = f"https://api.github.com/repos/{repo}"
          _, payload = request(f"{base}/actions/workflows/arenatrade_15m_auto.yml/runs?per_page=10")
          runs = payload.get("workflow_runs", [])
          active = [r for r in runs if r.get("status") in ("queued", "in_progress", "waiting")]
          if active:
              print(f"HEALTHY: daemon run {active[0]['id']} is {active[0]['status']}; no duplicate dispatched.")
              raise SystemExit(0)

          # Avoid a restart storm when GitHub's status API is momentarily delayed.
          now = time.time()
          recent = [r for r in runs if now - time.mktime(time.strptime(r["created_at"], "%Y-%m-%dT%H:%M:%SZ")) < 900]
          if recent and recent[0].get("conclusion") == "success":
              print("HEALTHY: previous cycle ended recently; handoff grace period active.")
              raise SystemExit(0)

          status, _ = request(
              f"{base}/actions/workflows/arenatrade_15m_auto.yml/dispatches",
              method="POST",
              body={"ref": "main"},
          )
          print(f"AUTO-HEAL: no daemon active; dispatched replacement (HTTP {status}).")
          PY
